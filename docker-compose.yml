services:
  app:
    build: .
    ports:
      - "${APP_PORT:-9360}:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INPUT_DIR: /data/input
      RESULTS_DIR: /data/results
      ARCHIVE_DIR: /data/archive
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: glm-ocr
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_THREAD: 8
      WHISPER_CLI: whisper-cli
      WHISPER_MODEL_PATH: /models/whisper/ggml-large-v3.bin
      WHISPER_THREADS: 8
      WHISPER_PROCESSORS: 1
      WHISPER_BEAM_SIZE: 1
      WHISPER_BEST_OF: 1
      WHISPER_NO_FALLBACK: "true"
      PDF_RENDER_DPI: 150
      PDF_AUTO_ORIENT: "true"
      PDF_AUTO_ORIENT_CLI: pdf-page-auto-orient
      URL_MAX_PER_TEXT: 8
      YT_DLP_CLI: yt-dlp
      HEADLESS_BROWSER_CLI: chromium
      WEBPAGE_CAPTURE_VIRTUAL_TIME_MS: 5000
      VIDEO_MIN_FRAMES: 3
      VIDEO_MAX_FRAMES: 24
      VIDEO_SCENE_THRESHOLD: 0.35
      RUST_LOG: info
    volumes:
      - ${DROP_INPUT_DIR:-/home/bfdev/Documents/universal-drop-input}:/data/input
      - ${DROP_RESULTS_DIR:-/home/bfdev/Documents/notes/ai_process_dump}:/data/results
      - ${DROP_ARCHIVE_DIR:-/home/bfdev/Documents/universal-drop-archive}:/data/archive
      - ${WHISPER_MODELS_DIR:-/home/bfdev/Documents/universal-drop-models/whisper}:/models/whisper:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_VULKAN: 1
      GGML_VK_VISIBLE_DEVICES: 0
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - label=disable
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
