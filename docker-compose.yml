services:
  app:
    build: .
    ports:
      - "${APP_PORT:-9360}:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INPUT_DIR: /data/input
      RESULTS_DIR: /data/results
      ARCHIVE_DIR: /data/archive
      FAILED_DIR: /data/failed
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-ocr}
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_THREAD: 8
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-600}"
      GEMINI_OCR_ENABLED: "${GEMINI_OCR_ENABLED:-true}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_API_KEY_HEADER: "${GEMINI_API_KEY_HEADER:-api-key}"
      GEMINI_API_ENDPOINT: "${GEMINI_API_ENDPOINT:-https://api.hku.hk/gemini/student/{deployment-id}:generateContent}"
      GEMINI_DEPLOYMENT_ID: "${GEMINI_DEPLOYMENT_ID:-gemini-3-flash-preview}"
      GEMINI_THINKING_BUDGET: "${GEMINI_THINKING_BUDGET:-}"
      GEMINI_TIMEOUT_SECONDS: "${GEMINI_TIMEOUT_SECONDS:-180}"
      GEMINI_MIN_INTERVAL_SECONDS: "${GEMINI_MIN_INTERVAL_SECONDS:-21}"
      WHISPER_CLI: whisper-cli
      WHISPER_MODEL_PATH: /models/whisper/ggml-large-v3.bin
      WHISPER_THREADS: 8
      WHISPER_PROCESSORS: 1
      WHISPER_BEAM_SIZE: 1
      WHISPER_BEST_OF: 1
      WHISPER_NO_FALLBACK: "true"
      PDF_RENDER_DPI: 150
      PDF_AUTO_ORIENT: "true"
      PDF_AUTO_ORIENT_CLI: pdf-page-auto-orient
      PDF_ORIENT_OCR_CONFIRM: "true"
      PDF_ORIENT_OCR_CLI: tesseract
      PDF_ORIENT_OCR_LANG: eng
      PDF_ORIENT_OCR_MIN_CONFIDENCE: 0.60
      PDF_ORIENT_OCR_MIN_SCORE: 20
      URL_MAX_PER_TEXT: 8
      YT_DLP_CLI: yt-dlp
      HEADLESS_BROWSER_CLI: chromium
      WEBPAGE_CAPTURE_VIRTUAL_TIME_MS: 5000
      VIDEO_MIN_FRAMES: 3
      VIDEO_MAX_FRAMES: 24
      VIDEO_SCENE_THRESHOLD: 0.35
      MAX_JOB_ATTEMPTS: "${MAX_JOB_ATTEMPTS:-1}"
      JOB_RETRY_BACKOFF_SECONDS: "${JOB_RETRY_BACKOFF_SECONDS:-30}"
      RUST_LOG: info
    volumes:
      - ${DROP_INPUT_DIR:-/Users/bfdev/Documents/universal-drop-input}:/data/input
      - ${DROP_RESULTS_DIR:-/Users/bfdev/Documents/universal-drop-outputs}:/data/results
      - ${DROP_ARCHIVE_DIR:-/Users/bfdev/Documents/universal-drop-archive}:/data/archive
      - ${DROP_FAILED_DIR:-/Users/bfdev/Documents/universal-drop-failed}:/data/failed
      - ${WHISPER_MODELS_DIR:-/Users/bfdev/Documents/universal-drop-models/whisper}:/models/whisper:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_VULKAN: 0
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-}
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
