services:
  app:
    build: .
    ports:
      - "${APP_PORT:-9360}:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      INPUT_DIR: /data/input
      RESULTS_DIR: /data/results
      ARCHIVE_DIR: /data/archive
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: glm-ocr
      OLLAMA_KEEP_ALIVE: 5m
      WHISPER_CLI: whisper-cli
      WHISPER_MODEL_PATH: /models/whisper/ggml-small.bin
      RUST_LOG: info
    volumes:
      - ${DROP_INPUT_DIR:-/home/bfdev/Documents/universal-drop-input}:/data/input
      - ${DROP_RESULTS_DIR:-/home/bfdev/Documents/notes/ai_process_dump}:/data/results
      - ${DROP_ARCHIVE_DIR:-/home/bfdev/Documents/universal-drop-archive}:/data/archive
      - ${WHISPER_MODELS_DIR:-/home/bfdev/Documents/universal-drop-models/whisper}:/models/whisper:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
